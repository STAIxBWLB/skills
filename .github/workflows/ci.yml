name: CI

# Verify-only guard for pull requests. The release workflow publishes on
# push to main; without this, a PR could merge a bundle that fails
# verification and break the publish run (or ship something the app would
# reject). No secrets, no signing, no publishing here.

on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make skills-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Verify skills
        run: make skills-verify
